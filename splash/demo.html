  <title>Blackglass splash demo</title>
  <style>
/* Blackglass splash. Inline this in <head> so the ground is on the first paint. */
#bgs{position:fixed;inset:0;z-index:2147483647;overflow:hidden;contain:strict;will-change:opacity;cursor:default;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;animation:bgs-failsafe 1ms 7s forwards}
@keyframes bgs-failsafe{to{visibility:hidden;opacity:0}}
.bgs-bg{position:absolute;inset:0;background:#101113}

/* Lockup: height clamp(48px, 8vmin, 104px), centred. Ratios come from the 530.087 x 88 viewBox. */
.bgs-l{--h:clamp(48px,8vmin,104px);position:absolute;left:calc(50% - var(--h)*3.011858);top:calc(50% - var(--h)*.5);width:calc(var(--h)*6.023716);height:var(--h)}
/* Both layers use the lockup's own viewBox and box, so they pixel-snap exactly like the static SVG. */
.bgs-m,.bgs-w{position:absolute;inset:0;display:block;width:100%;height:100%;overflow:visible}

/* Pre-roll state, so nothing flashes before the script runs. */
#bgs #pane,#bgs #glint,.bgs-fx,.bgs-sl,.bgs-gr{opacity:0}

/* HUD. Own layer keeps text on greyscale anti-aliasing: LCD fringes would put colour outside the palette. */
.bgs-h{--i:24px;--k:12px;position:absolute;inset:0;pointer-events:none;will-change:transform;color:#8E949B;font:500 11px/18px "Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase;font-variant-numeric:tabular-nums;white-space:nowrap}
.bgs-h p,.bgs-h ol{position:absolute;margin:0;padding:0;list-style:none}
.bgs-tl,.bgs-tr{top:var(--i)}
.bgs-bl,.bgs-br{bottom:var(--i)}
.bgs-tl,.bgs-bl{left:var(--i)}
.bgs-tr,.bgs-br{right:calc(var(--i) - .16em)}
.bgs-bl li{display:flex;align-items:center;gap:10px;opacity:.35}
.bgs-bl b{flex:none;box-sizing:border-box;width:7px;height:7px;border:1px solid}
.bgs-bl .on{opacity:1}
.bgs-bl .on b{background:#F4F5EF;border-color:#F4F5EF}
.bgs-h i{position:absolute;width:12px;height:12px;border:0 solid #2A2C30}
.bgs-h i:nth-of-type(1){top:var(--k);left:var(--k);border-width:1px 0 0 1px}
.bgs-h i:nth-of-type(2){top:var(--k);right:var(--k);border-width:1px 1px 0 0}
.bgs-h i:nth-of-type(3){bottom:var(--k);left:var(--k);border-width:0 0 1px 1px}
.bgs-h i:nth-of-type(4){bottom:var(--k);right:var(--k);border-width:0 1px 1px 0}

/* Stacked under 640px: mark min(30vw,132px); wordmark (409.593 units) at 72vw, one unit = .175784vw. */
@media (max-width:639.98px){
  .bgs-l{--m:min(30vw,132px);left:14vw;width:72vw;height:calc(var(--m)*1.344 + 6.8064vw);top:calc(50% - var(--m)*.672 - 3.4032vw)}
  .bgs-m{left:calc(50% - var(--m)*.5);height:var(--m);width:calc(var(--m)*6.023716)}
  .bgs-w{left:-20.7425vw;top:calc(var(--m)*1.344 - 4.3313vw);width:93.1795vw;height:15.469vw}
  .bgs-h{--i:16px;--k:8px}
}

/* ?splash=debug only */
.bgs-dbg{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);display:flex;gap:12px;align-items:center}
.bgs-dbg button{font:500 11px/1 ui-monospace,monospace;letter-spacing:.16em;color:#F4F5EF;background:none;border:1px solid #2A2C30;padding:8px 10px;cursor:pointer}
.bgs-dbg input{width:min(60vw,480px);accent-color:#8E949B}
  </style>

    .demo-bar button + button{color:#F4F5EF;background:#101113;box-shadow:inset 0 0 0 1px #2A2C30}
  </style>
